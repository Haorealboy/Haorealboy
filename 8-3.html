<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quà 8/3</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#001a33,#00264d);
font-family:sans-serif;
overflow:hidden;
color:white;
}

#flower{
text-align:center;
cursor:pointer;
animation:float 3s ease-in-out infinite;
}

#flower img{
width:220px;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

#card{
position:absolute;
background:white;
color:black;
padding:30px;
border-radius:20px;
text-align:center;
width:320px;
display:none;
animation:show 0.6s;
}

@keyframes show{
from{transform:scale(0);opacity:0}
to{transform:scale(1);opacity:1}
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
background:pink;
border-radius:20px;
cursor:pointer;
font-size:16px;
}

.heart{
position:absolute;
color:pink;
animation:fly 5s linear infinite;
}

@keyframes fly{
0%{transform:translateY(0);opacity:1}
100%{transform:translateY(-800px);opacity:0}
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
}

</style>
</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3">
</audio>

<div id="flower" onclick="showCard()">

<h2>Bó hoa tặng cậu 🌷</h2>

<img src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png">

<p>Nhấn vào bó hoa</p>

</div>

<div id="card">

<h2>Gửi cậu 🌷</h2>

<p>
Chúc cậu một ngày 8/3 thật vui vẻ,  
luôn xinh đẹp và hạnh phúc.  
Mong rằng mỗi ngày của cậu đều  
tràn đầy niềm vui và nụ cười 💗
</p>

<button onclick="closeCard()">Đóng</button>

</div>

<script>

function showCard(){
document.getElementById("card").style.display="block";
}

function closeCard(){
document.getElementById("card").style.display="none";
}

function createHeart(){
let heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤"
heart.style.left=Math.random()*100+"vw"
heart.style.bottom="0"
heart.style.fontSize=Math.random()*20+10+"px"

document.body.appendChild(heart)

setTimeout(()=>heart.remove(),5000)
}

setInterval(createHeart,500)

</script>

</body>
</html>
